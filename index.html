<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تلميع الأرضيات بعد التشطيب</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
color: #2c3e50;
text-align: center;
padding: 30px 15px;
min-height: 100vh;
}
h1 {
font-size: 2.2rem;
margin-bottom: 10px;
color: #0f4c81;
letter-spacing: 0.5px;
}
.subtitle {
font-size: 1rem;
color: #5a6c7d;
margin-bottom: 30px;
}
.gallery {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 18px;
max-width: 1000px;
margin: 0 auto;
}
.gallery img {
width: 100%;
max-width: 300px;
height: 220px;
border-radius: 14px;
box-shadow: 0 6px 18px rgba(0,0,0,0.12);
object-fit: cover;
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.gallery img:hover {
transform: scale(1.04);
box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
footer {
margin-top: 40px;
font-size: 0.9rem;
color: #8899a6;
}
</style>
</head>
<body>

<h1>تلميع الأرضيات بعد التشطيب</h1>
<p class="subtitle">أعمال احترافية لإعادة اللمعان وحماية الأرضيات</p>

<div class="gallery">
<img src="floor-1.jpg" alt="تلميع أرضية 1">
<img src="floor-2.jpg" alt="تلميع أرضية 2">
<img src="floor-3.jpg" alt="تلميع أرضية 3">
<img src="floor-4.jpg" alt="تلميع أرضية 4">
<img src="floor-5.jpg" alt="تلميع أرضية 5">
<img src="floor-6.jpg" alt="تلميع أرضية 6">
</div>

<footer>© جميع الحقوق محفوظة</footer>

</body>
</html>
